<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIDM-SIM Parallel Futures</title><style>body{font-family:Arial,sans-serif;margin:0;background:#07111f;color:#e9f2ff}main{max-width:1100px;margin:auto;padding:32px}.card{background:#0d1b2d;border:1px solid #233a57;border-radius:14px;padding:20px;margin:16px 0}button{background:#2f76ff;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}textarea{width:100%;min-height:90px;background:#091523;color:#fff;border:1px solid #314765;border-radius:8px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.branch{background:#101f33;border-radius:10px;padding:14px}.bar{height:8px;background:#20334c;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#4ca3ff}pre{white-space:pre-wrap;word-break:break-word}small{color:#9eb4cf}</style></head><body><main><h1>CIDM-SIM Parallel Futures</h1><p>Stochastic physical-world branching from incomplete information.</p><div class="card"><h2>Parallel future demo</h2><button onclick="loadBranches()">Generate branches</button><div id="branches" class="grid"></div></div><div class="card"><h2>NVIDIA Nemotron event interpreter</h2><textarea id="obs">A fast-moving low-pressure disturbance appears near the western boundary and is intensifying.</textarea><br><br><button onclick="interpret()">Interpret event</button><pre id="event"></pre></div><small>Research simulation prototype, not a safety-critical forecasting service.</small><script>async function loadBranches(){const r=await fetch('/api/demo-branches');const d=await r.json();const el=document.getElementById('branches');el.innerHTML='';d.branches.forEach(b=>{const c=document.createElement('div');c.className='branch';c.innerHTML=`<b>Future ${b.branch+1}</b><p>P=${b.probability.toFixed(3)}</p><div class="bar"><span style="width:${Math.min(100,b.probability*300)}%"></span></div><p>${b.trajectory.map(x=>x.toFixed(3)).join(' → ')}</p>`;el.appendChild(c);});}async function interpret(){const observation=document.getElementById('obs').value;const r=await fetch('/api/interpret-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({observation})});document.getElementById('event').textContent=JSON.stringify(await r.json(),null,2);}</script></main></body></html>
